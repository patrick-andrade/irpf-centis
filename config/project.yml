project:
  id: irpf-centis
  title: "Distribuição de renda e patrimônio no IRPF por centis"
  language: pt-BR
  status: public-beta

analysis:
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  primary_ranking: RB4
  comparison_rankings: [RTB, RB3, RB5]
  real_price_base_year: 2024
  atkinson_epsilon: 0.5
  esteban_ray_alpha: [1.0, 1.3, 1.6]
  grouped_estimates: true
  causal_inference: false

data:
  raw_dir: data/raw
  metadata_dir: data/metadata
  external_dir: data/external
  interim_dir: data/interim
  processed_dir: data/processed
  manifest: data/metadata/sources-manifest.csv
  discovered: data/metadata/sources-discovered.csv

release:
  human_review_required: true
  # Decisão do autor em 2026-08-19: repositório público com site no GitHub Pages.
  public_repository: true
  real_data_required: true
  checklist: internal/release-checklist.md

