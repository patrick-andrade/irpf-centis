name: Erro no código ou nas páginas
description: Algo quebra, não carrega ou se comporta de forma inesperada
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que acontece
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir a página (ex.: Explorar, Evolução)
        2. Selecionar ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde
      options:
        - Páginas Explorar publicadas (navegador)
        - Site e relatórios publicados
        - Pipeline local (run.sh / run.cmd)
        - Site renderizado localmente
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Para as páginas publicadas, navegador, sistema e o link da visão (botão "Copiar link desta visão"). Para uso local, saída de `sessionInfo()` e `node --version`.
      render: text
