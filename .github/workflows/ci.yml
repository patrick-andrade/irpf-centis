name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Preparar pacotes de base do renv
        # A instalação via renv expande uma cadeia de dependências que bloqueia
        # curl no runner. Instalar as versões exatas do lockfile primeiro.
        # secretbase entrou na lista em 2026-10, quando a 1.3.0 foi para o
        # arquivo do CRAN: o restore passou a acusar ciclo entre ela, targets e
        # tarchetypes e não instalava nenhuma das três.
        run: |
          Rscript -e 'utils::install.packages("https://cran.r-project.org/src/contrib/Archive/curl/curl_7.1.0.tar.gz", lib = renv::paths$library(), repos = NULL, type = "source", dependencies = FALSE)'
          Rscript -e 'utils::install.packages("https://cran.r-project.org/src/contrib/Archive/writexl/writexl_2.0.0.tar.gz", lib = renv::paths$library(), repos = NULL, type = "source", dependencies = FALSE)'
          Rscript -e 'utils::install.packages("https://cran.r-project.org/src/contrib/Archive/secretbase/secretbase_1.3.0.tar.gz", lib = renv::paths$library(), repos = NULL, type = "source", dependencies = FALSE)'
          Rscript -e 'stopifnot(as.character(packageVersion("curl")) == "7.1.0", as.character(packageVersion("writexl")) == "2.0.0", as.character(packageVersion("secretbase")) == "1.3.0")'
      - uses: r-lib/actions/setup-renv@v2
      - name: Testes e diagnóstico de lint
        run: Rscript scripts/run.R check

  # Camada visual: módulo JS das páginas Explorar e das figuras dos relatórios.
  # O bundle servido ao site fica versionado, porque o deploy só repete o render
  # do Quarto; aqui ele é gerado de novo e precisa sair idêntico ao do git.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes do módulo JS
        run: npm test
      - name: Bundle versionado em dia
        run: |
          npm run build
          git diff --exit-code -- assets/js || { echo "assets/js/irpf-viz.js desatualizado: rode npm run build e commite"; exit 1; }

  # Site renderizado como no deploy (replay do _freeze, sem R) e testado num
  # navegador de verdade: erro em tempo de execução, arquivo não copiado,
  # tempo até o primeiro gráfico e acessibilidade (axe).
  site:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # A mesma versão do deploy: o runtime OJS e o Typst mudam com o Quarto.
          version: 1.9.38
      - name: Renderizar site (replay do _freeze)
        run: quarto render
      - name: Testes de fumaça no navegador
        env:
          NAVEGADOR: /usr/bin/google-chrome
        run: npm run smoke
