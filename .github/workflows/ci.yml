name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # renv 1.2.3 no restore fresco (cache GHA expirado) baixa curl/writexl e não
  # os instala. CI instala as Imports da DESCRIPTION via pak/RSPM.
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev pkg-config zlib1g-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::lintr
      - name: Testes e lint
        run: Rscript scripts/run.R check
