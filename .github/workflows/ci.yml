name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # renv 1.2.3 no restore fresco (cache GHA expirado) marca curl/writexl como
  # instalados no download e depois os deixa de fora do grafo, sem R CMD INSTALL.
  # pak instala o lockfile direto; o autoloader do renv não deve trocar a lib.
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev pkg-config zlib1g-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Restaurar lockfile
        run: |
          install.packages("pak")
          pak::lockfile_install("renv.lock")
        shell: Rscript {0}
      - name: Testes e lint
        run: Rscript scripts/run.R check
