name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # renv 1.2.3 no restore fresco (cache GHA expirado) omitia o erro de curl/writexl.
  RENV_CONFIG_INSTALL_JOBS: "1"
  RENV_CONFIG_INSTALL_VERBOSE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev pkg-config zlib1g-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Testes e lint
        run: Rscript scripts/run.R check
