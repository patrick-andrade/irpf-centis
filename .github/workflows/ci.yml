name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Preparar pacotes de base do renv
        # restore(packages=...) expande dependências do lockfile; instalar estes
        # dois pacotes diretamente evita o ciclo de instalação visto no runner.
        run: |
          Rscript -e 'renv::install("curl@7.1.0", prompt = FALSE, lock = FALSE)'
          Rscript -e 'renv::install("writexl@2.0.0", prompt = FALSE, lock = FALSE)'
      - uses: r-lib/actions/setup-renv@v2
      - name: Testes e diagnóstico de lint
        run: Rscript scripts/run.R check
