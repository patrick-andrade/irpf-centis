name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (sf, arrow, igraph)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev libarchive-dev libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Preparar pacotes de base do renv
        # O restore simultâneo do lockfile no runner deixou curl e writexl em
        # uma cadeia de dependências que impediu a execução dos testes.
        run: |
          Rscript -e 'renv::restore(packages = "curl", prompt = FALSE)'
          Rscript -e 'renv::restore(packages = "writexl", prompt = FALSE)'
      - uses: r-lib/actions/setup-renv@v2
      - name: Testes e diagnóstico de lint
        run: Rscript scripts/run.R check
