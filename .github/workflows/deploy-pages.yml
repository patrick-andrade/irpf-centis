name: Publicar site

# Publica só depois de o CI passar no main: antes, os dois rodavam em paralelo
# e um push com teste quebrado chegava ao ar do mesmo jeito.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # O job de deploy não deve ativar o renv: o render usa o _freeze/ committed
  # e o export shinylive empacota os pacotes instalados abaixo.
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  # Um CI antigo pode terminar depois de um novo e disparar esta publicação por
  # último; publicar o commit dele levaria o site de volta. Só segue o commit
  # que o CI testou se ele ainda for a ponta do main. Este job não entra no
  # grupo de concorrência, para que uma execução descartada não cancele a nova.
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.ponta.outputs.publicar }}
      sha: ${{ steps.ponta.outputs.sha }}
    steps:
      - id: ponta
        env:
          GH_TOKEN: ${{ github.token }}
          TESTADO: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ponta=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "sha=$TESTADO" >> "$GITHUB_OUTPUT"
          if [ "$ponta" = "$TESTADO" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "O main já está em $ponta; $TESTADO não será publicado."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verificar
    if: needs.verificar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Publica exatamente o commit que o CI aprovou.
          ref: ${{ needs.verificar.outputs.sha }}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Renderizar site (replay do _freeze)
        run: quarto render
      - name: Guardas de integridade do freeze
        run: |
          test -d _freeze/reports/report || { echo "_freeze ausente: renderize localmente antes do push"; exit 1; }
          if grep -rl "Dados processados ainda não disponíveis" output/site/reports; then
            echo "Relatórios renderizaram sem dados: freeze desatualizado"; exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Instalar shinylive e os pacotes do painel
        # O shinylive só leva ao site os pacotes que encontra instalados aqui, e
        # baixa os binários WebAssembly na versão que o repositório do webR
        # servir no dia; scripts/export-app.R compara essas versões com o
        # renv.lock testado no CI e falha se divergirem. pak usa binários do
        # P3M. `--no-init-file` ignora o .Rprofile do projeto, que força o CRAN
        # em código-fonte e ativaria o renv.
        run: |
          Rscript --no-init-file -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
          Rscript --no-init-file -e 'pak::pak(c("shinylive@0.5.0", "shiny", "bslib", "bsicons", "ggplot2", "dplyr", "scales", "tibble", "viridisLite"))'
      - name: Exportar painel shinylive
        run: |
          Rscript --no-init-file scripts/export-app.R
          touch output/site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/site

  deploy:
    needs: [verificar, build]
    runs-on: ubuntu-latest
    # Publicações enfileiram em ordem, sem cancelar a que já está no ar.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: ponta
        # Confere de novo: o main pode ter avançado enquanto o build rodava.
        env:
          GH_TOKEN: ${{ github.token }}
          TESTADO: ${{ needs.verificar.outputs.sha }}
        run: |
          ponta=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$ponta" = "$TESTADO" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "O main avançou para $ponta durante o build; $TESTADO não será publicado."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.ponta.outputs.publicar == 'true'
        uses: actions/deploy-pages@v4
