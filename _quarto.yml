project:
  type: website
  output-dir: output/site
  render:
    - index.qmd
    - reports/report.qmd
    - reports/technical-appendix.qmd
    - reports/executive-summary.qmd
    - docs/methodology.md
    - docs/limitations.md
    - docs/reproducibility.md
    - docs/data-dictionary.md
    - docs/provenance.md
    - explorar/index.qmd
    - explorar/evolucao.qmd
    - explorar/topos.qmd
    - explorar/estados.qmd
  resources:
    - styles/fonts/*
    # Dados das páginas Explorar. Os arquivos por geografia são lidos com nome
    # montado em tempo de execução, que o Quarto não detecta sozinho.
    - explorar/dados/**
    - assets/js/*

website:
  title: "IRPF por centis"
  site-url: https://patrick-andrade.github.io/irpf-centis
  repo-url: https://github.com/patrick-andrade/irpf-centis
  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: "Início"
      - href: reports/report.qmd
        text: "Relatório"
      - href: reports/executive-summary.qmd
        text: "Sumário executivo"
      # Seis páginas de método num só menu: na barra, cada uma ocupava uma
      # entrada e a navegação quebrava em duas linhas em telas médias.
      - text: "Método"
        menu:
          - href: docs/methodology.md
            text: "Metodologia"
          - href: docs/limitations.md
            text: "Limitações"
          - href: reports/technical-appendix.qmd
            text: "Apêndice técnico"
          - href: docs/reproducibility.md
            text: "Reprodução"
          - href: docs/data-dictionary.md
            text: "Dicionário de dados"
          - href: docs/provenance.md
            text: "Proveniência"
      - href: explorar/index.qmd
        text: "Explorar"
      - href: app/
        text: "Painel interativo"
    right:
      - icon: github
        href: https://github.com/patrick-andrade/irpf-centis
        aria-label: "GitHub"
  page-footer:
    center: "Fonte dos dados: Receita Federal do Brasil. Índices calculados com dados agrupados de declarações válidas do IRPF."

lang: pt-BR
bibliography: reports/references.bib
execute:
  echo: false
  warning: false
  message: false
  freeze: auto

format:
  html:
    theme: [default, styles/site.scss]
    toc: true
    toc-depth: 3
    code-fold: true
    fig-width: 9
    fig-height: 5
    fig-responsive: true
